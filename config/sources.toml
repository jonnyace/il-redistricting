license = "Public domain (U.S. Government work)"
sha256 = "531f7843f9d34d744f989ead86d7589f96ea8fa672f416a895f5a7283f5de36f"

[enacted_sldl_shapes]
desc = "US Census Bureau TIGER/Line 2022 State Legislative Districts, lower chamber, Illinois (enacted House map geometry, for compactness comparison only)."
url = "https://www2.census.gov/geo/tiger/TIGER2022/SLDL/tl_2022_17_sldl.zip"
