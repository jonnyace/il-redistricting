# Every public input the program reads. URLs are pinned (commit SHAs for GitHub
# data) and each file's SHA-256 is checked after download, so a changed upstream
# file stops the build instead of silently changing the map.
# sha256 = "" means "record on first fetch" (see `ilredistrict fetch --record`).

[census_pl]
desc = "US Census Bureau, 2020 Census Redistricting Data (P.L. 94-171), Illinois legacy-format summary file: block population (P1) and voting-age population by Hispanic origin and race (P4), plus the geographic header (county, county subdivision/township, place, VTD)."
url = "https://www2.census.gov/programs-surveys/decennial/2020/data/01-Redistricting_File--PL_94-171/Illinois/il2020.pl.zip"
file = "il2020.pl.zip"
license = "Public domain (U.S. Government work)"
sha256 = "e73f82d6aea0b9b372e9f8572c6edbedfa72ae9fc2039da84faf0cdf0c478a32"

[tiger_vtd]
desc = "US Census Bureau TIGER/Line 2020 PL Voting Tabulation Districts (VTDs) for Illinois: the building blocks of every district."
url = "https://www2.census.gov/geo/tiger/TIGER2020PL/STATE/17_ILLINOIS/17/tl_2020_17_vtd20.zip"
file = "tl_2020_17_vtd20.zip"
license = "Public domain (U.S. Government work)"
sha256 = "adbdd52c7e295139027ae87ed6465675dc73875e657f256dedc4d0f6e48419fe"

[enacted_sldl_bef]
desc = "US Census Bureau 2022 State Legislative District block equivalency files (the enacted 2021 Illinois House map, effective for the 2022 election). Used only for comparison."
